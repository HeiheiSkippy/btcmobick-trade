# GitHub disables scheduled workflows after 60 days without repository activity.
# Re-enabling them monthly through the API restarts that count without adding commits.
# A failed run sends GitHub's usual failure email; a workflow that is already disabled must be re-enabled by hand.
name: keepalive

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow enable pages.yml
          gh workflow enable keepalive.yml
