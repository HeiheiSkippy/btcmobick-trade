# Publishes site/ to GitHub Pages on every push to main and every 5 minutes.
# Each run refreshes the data files the page reads but browsers can't fetch directly
# (LBank REST blocks cross-site requests; GeckoTerminal is rate-limited per IP).
# 5 minutes is GitHub's minimum schedule; in practice runs come every 5-15 minutes.
# Repository Settings -> Pages -> Source must be "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to commit hashes; update the hash and the version comment together.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Every data step may fail without blocking the deploy; the page then shows the value as stale or missing.
      # Each step reads the currently published file first and keeps its values if fetching fails.
      - name: LBank hourly candles
        continue-on-error: true
        run: node src/lbank-kline.mjs site/data/lbank-kline.json "${{ steps.pages.outputs.base_url }}/data/lbank-kline.json"
      # Fallback candles built from on-chain swaps, used when GeckoTerminal data is missing.
      - name: Uniswap on-chain history
        continue-on-error: true
        run: node src/uni-history.mjs site/data/uni-history.json "${{ steps.pages.outputs.base_url }}/data/uni-history.json" --no-trades
      # Hourly candles and 24h volume. A 429 is not treated as a failure; a changed response format is.
      - name: Uniswap GeckoTerminal data
        continue-on-error: true
        run: node src/uni-gecko.mjs site/data/uni-gecko.json "${{ steps.pages.outputs.base_url }}/data/uni-gecko.json" --no-trades
      # Pool and route list for Uniswap quotes. Rebuilt only when older than 6 hours; on failure the published file stays.
      - name: Uniswap pool list
        continue-on-error: true
        run: |
          curl -sfL "${{ steps.pages.outputs.base_url }}/data/uni-pools.json" -o site/data/uni-pools.json || rm -f site/data/uni-pools.json
          node src/uni-pools.mjs site/data/uni-pools.json
      - name: LBank deposit/withdraw settings
        continue-on-error: true
        run: node src/lbank-fees.mjs site/data/lbank-fees.json "${{ steps.pages.outputs.base_url }}/data/lbank-fees.json"
      # Checks that the withdraw fee endpoints the page calls still work. GitHub runners are outside Korea,
      # so a Binance-only failure here may not affect visitors.
      - name: Withdraw fee endpoint check
        continue-on-error: true
        run: node src/check-fees.mjs
      - name: Uniswap pool list check
        continue-on-error: true
        run: node src/check-uni-pools.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
